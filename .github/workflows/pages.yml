name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/lucid-heisenberg-d05rhn, main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        working-directory: site
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
      - name: Rewrite root-absolute URLs for project Pages (/blog-ai/)
        working-directory: site
        run: BASE=/blog-ai node scripts/rewrite-base.mjs dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
